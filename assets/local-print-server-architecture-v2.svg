<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How Multimédica prints thermal tickets</title>
  <desc id="desc">The Multimédica cloud application sends a print request over the clinic network to a Windows computer running the Local Print Server. The server translates the request into ESC/POS printer commands and sends them to the thermal ticket printer. A direct standard Windows print job is not supported.</desc>
  <defs>
    <marker id="arrow" markerWidth="3.25" markerHeight="3.25" refX="2.5" refY="1.625" orient="auto">
      <path d="M0,0 L3.25,1.625 L0,3.25 Z" fill="#17698a"/>
    </marker>
    <marker id="arrow-red" markerWidth="3.25" markerHeight="3.25" refX="2.5" refY="1.625" orient="auto">
      <path d="M0,0 L3.25,1.625 L0,3.25 Z" fill="#b73a3a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#173647" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 44px Arial, Helvetica, sans-serif; fill: #15384a; }
      .subtitle { font: 400 24px Arial, Helvetica, sans-serif; fill: #496675; }
      .box-title { font: 700 30px Arial, Helvetica, sans-serif; fill: white; }
      .box-text { font: 400 22px Arial, Helvetica, sans-serif; fill: white; }
      .step { font: 700 20px Arial, Helvetica, sans-serif; fill: #17698a; }
      .flow { font: 700 22px Arial, Helvetica, sans-serif; fill: #15384a; }
      .small { font: 400 19px Arial, Helvetica, sans-serif; fill: #496675; }
      .warning { font: 700 21px Arial, Helvetica, sans-serif; fill: #9e2f2f; }
      .marker-letter { font: 700 20px Arial, Helvetica, sans-serif; fill: #15384a; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f5f8fa"/>
  <text x="800" y="70" text-anchor="middle" class="title">How Multimédica Prints Thermal Tickets</text>
  <text x="800" y="112" text-anchor="middle" class="subtitle">The Local Print Server is the translator between the web application and the ESC/POS printer.</text>

  <rect x="65" y="160" width="1470" height="560" rx="26" fill="#e8eef2" stroke="#b8c8d1" stroke-width="2"/>
  <text x="105" y="205" class="small" font-weight="700">CLINIC LOCAL AREA NETWORK</text>

  <!-- Application -->
  <g filter="url(#shadow)">
    <rect x="105" y="285" width="350" height="270" rx="20" fill="#337c25"/>
  </g>
  <circle cx="150" cy="330" r="22" fill="#ffffff" opacity="0.2"/>
  <text x="150" y="338" text-anchor="middle" class="box-title" font-size="23">1</text>
  <text x="280" y="370" text-anchor="middle" class="box-title">Multimédica App</text>
  <text x="280" y="414" text-anchor="middle" class="box-text">running in a web browser</text>
  <text x="280" y="470" text-anchor="middle" class="box-text">Creates the ticket content</text>
  <text x="280" y="505" text-anchor="middle" class="box-text">and requests a print</text>

  <!-- Local print server -->
  <g filter="url(#shadow)">
    <rect x="625" y="255" width="350" height="330" rx="20" fill="#17698a"/>
  </g>
  <circle cx="670" cy="300" r="22" fill="#ffffff" opacity="0.2"/>
  <text x="670" y="308" text-anchor="middle" class="box-title" font-size="23">2</text>
  <text x="800" y="345" text-anchor="middle" class="box-title">Windows Computer</text>
  <text x="800" y="387" text-anchor="middle" class="box-text">running the</text>
  <text x="800" y="425" text-anchor="middle" class="box-title">Local Print Server</text>
  <circle cx="940" cy="300" r="24" fill="#ffd45c" stroke="#15384a" stroke-width="3"/>
  <text x="940" y="307" text-anchor="middle" class="marker-letter">A</text>
  <rect x="680" y="460" width="240" height="76" rx="12" fill="#ffffff" opacity="0.16"/>
  <text x="800" y="491" text-anchor="middle" class="box-text" font-weight="700">TRANSLATES</text>
  <text x="800" y="521" text-anchor="middle" class="box-text">request → ESC/POS</text>

  <!-- Printer -->
  <g filter="url(#shadow)">
    <rect x="1145" y="285" width="350" height="270" rx="20" fill="#17698a"/>
  </g>
  <circle cx="1190" cy="330" r="22" fill="#ffffff" opacity="0.2"/>
  <text x="1190" y="338" text-anchor="middle" class="box-title" font-size="23">3</text>
  <text x="1320" y="372" text-anchor="middle" class="box-title">Thermal Ticket Printer</text>
  <text x="1320" y="420" text-anchor="middle" class="box-text">Understands ESC/POS</text>
  <text x="1320" y="455" text-anchor="middle" class="box-text">printer commands</text>
  <text x="1320" y="510" text-anchor="middle" class="box-text">Prints the patient ticket</text>
  <circle cx="1460" cy="330" r="24" fill="#ffd45c" stroke="#15384a" stroke-width="3"/>
  <text x="1460" y="337" text-anchor="middle" class="marker-letter">B</text>

  <!-- Flow arrows -->
  <rect x="465" y="330" width="130" height="76" rx="12" fill="#ffffff" stroke="#b8c8d1" stroke-width="2"/>
  <text x="530" y="360" text-anchor="middle" class="flow">HTTP</text>
  <text x="530" y="388" text-anchor="middle" class="small">print request</text>
  <path d="M455 455 H605" fill="none" stroke="#17698a" stroke-width="10" marker-end="url(#arrow)"/>

  <rect x="985" y="330" width="130" height="76" rx="12" fill="#ffffff" stroke="#b8c8d1" stroke-width="2"/>
  <text x="1050" y="360" text-anchor="middle" class="flow">ESC/POS</text>
  <circle cx="1010" cy="383" r="15" fill="#ffd45c" stroke="#15384a" stroke-width="2"/>
  <text x="1010" y="389" text-anchor="middle" class="marker-letter" font-size="16">C</text>
  <text x="1068" y="389" text-anchor="middle" class="small">port 9100</text>
  <path d="M975 455 H1125" fill="none" stroke="#17698a" stroke-width="10" marker-end="url(#arrow)"/>

  <!-- Explanatory contrast -->
  <rect x="105" y="755" width="1390" height="100" rx="18" fill="#fff7f7" stroke="#db9d9d" stroke-width="2"/>
  <path d="M170 805 H275" fill="none" stroke="#b73a3a" stroke-width="7" stroke-dasharray="12 10" marker-end="url(#arrow-red)"/>
  <line x1="207" y1="780" x2="240" y2="830" stroke="#b73a3a" stroke-width="8"/>
  <line x1="240" y1="780" x2="207" y2="830" stroke="#b73a3a" stroke-width="8"/>
  <text x="315" y="793" class="warning">A normal Windows printer driver cannot perform this job.</text>
  <text x="315" y="827" class="small">The thermal printer expects ESC/POS commands, so the Local Print Server is required.</text>
</svg>
